<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار رفع الصور | أبو صلاح</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A2E36;--bg2:#0E3A44;--primary:#FF9800;--primary2:#FFB74D;--accent:#4DD0E1;--hot:#E91E63;--text:#F5F0E1;--dim:#A8C5CC}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:linear-gradient(135deg,var(--bg),var(--bg2));min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--text);line-height:1.7}
.card{background:linear-gradient(160deg,rgba(14,58,68,.95),rgba(10,46,54,.95));border-radius:28px;padding:36px 28px;max-width:520px;width:100%;box-shadow:0 40px 100px rgba(0,0,0,.5),0 0 0 1px rgba(255,152,0,.3);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--primary),var(--hot),var(--primary),var(--accent))}
.ornament{text-align:center;color:var(--primary);opacity:.6;letter-spacing:12px;font-size:14px;margin-bottom:10px}
h1{text-align:center;font-family:'Amiri',serif;font-size:26px;font-weight:700;color:var(--primary2);margin-bottom:8px}
.sub{text-align:center;font-size:13px;color:var(--dim);margin-bottom:24px}
.info-box{background:rgba(77,208,225,.08);border:1px solid rgba(77,208,225,.3);border-radius:14px;padding:14px 16px;margin-bottom:20px;font-size:12.5px;line-height:1.7}
.info-box strong{color:var(--accent)}
.preview{width:100%;aspect-ratio:1/1;max-width:280px;margin:0 auto 18px;border-radius:16px;background:rgba(10,46,54,.6);border:2px dashed rgba(255,152,0,.4);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.preview img{width:100%;height:100%;object-fit:cover}
.preview-icon{font-size:48px;color:var(--primary);opacity:.5}
.file-wrap{position:relative;width:100%;margin-bottom:14px}
.file-input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;z-index:2}
.file-btn{padding:16px;border-radius:50px;background:rgba(255,152,0,.08);color:var(--primary);border:1.5px dashed rgba(255,152,0,.55);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .2s;cursor:pointer}
.file-input:hover + .file-btn{background:rgba(255,152,0,.15)}
.progress{height:6px;border-radius:3px;background:rgba(10,46,54,.8);overflow:hidden;margin-bottom:14px;display:none}
.progress.show{display:block}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:width .3s;border-radius:3px}
.status{padding:14px 18px;border-radius:14px;font-size:13.5px;font-weight:700;text-align:center;margin-bottom:14px;display:none;line-height:1.6}
.status.show{display:block}
.status.loading{background:rgba(255,152,0,.1);color:var(--primary);border:1px solid rgba(255,152,0,.3)}
.status.success{background:rgba(37,211,102,.15);color:#7CFC00;border:1px solid rgba(37,211,102,.4)}
.status.error{background:rgba(233,30,99,.15);color:#E85D5D;border:1px solid rgba(232,93,93,.4)}
.url-box{background:rgba(10,46,54,.7);border:1px solid rgba(255,152,0,.3);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:11.5px;word-break:break-all;direction:ltr;text-align:left;color:var(--text);display:none;line-height:1.6}
.url-box.show{display:block}
.url-label{color:var(--primary);font-weight:700;font-size:11px;margin-bottom:6px;direction:rtl;text-align:right}
.copy-btn{width:100%;padding:12px;border-radius:50px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:13px;font-weight:900;margin-top:10px;transition:all .2s;border:none;cursor:pointer;font-family:inherit}
.copy-btn:active{transform:scale(.97)}
.details{margin-top:16px;padding-top:16px;border-top:1px dashed rgba(255,152,0,.25);font-size:12px;color:var(--dim);line-height:1.8}
.details strong{color:var(--primary)}
</style>
</head>
<body>

<div class="card">
  <div class="ornament">✦ ✦ ✦</div>
  <h1>اختبار رفع الصور</h1>
  <p class="sub">أبو صلاح — نظام الصور</p>

  <div class="info-box">
    <strong>📌 هدف الصفحة:</strong> رفع صورة للتأكد من أن نظام الصور يعمل بشكل صحيح.
  </div>

  <div class="preview" id="preview">
    <div class="preview-icon">📷</div>
  </div>

  <div class="file-wrap">
    <input type="file" class="file-input" id="fileInput" accept="image/*">
    <div class="file-btn">📁 اختر صورة للاختبار</div>
  </div>

  <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
  <div class="status" id="status"></div>

  <div class="url-box" id="urlBox">
    <div class="url-label">الرابط النهائي للصورة:</div>
    <div id="urlText"></div>
    <button class="copy-btn" id="copyBtn">📋 انسخي الرابط</button>
  </div>

  <div class="details">
    <strong>📊 تفاصيل:</strong><br>
    <span id="detailsText">في انتظار اختيار صورة...</span>
  </div>
</div>

<script>
const CLOUD_NAME = "vfdkxutu";
const UPLOAD_PRESET = "abosalah";
const FOLDER = "abosalah/menu";

const $ = id => document.getElementById(id);

function setStatus(msg, type) {
  const s = $("status");
  s.textContent = msg;
  s.className = "status show " + type;
}
function hideStatus() { $("status").className = "status"; }
function setProgress(p) {
  const prog = $("progress"), bar = $("progressBar");
  if (p > 0) prog.classList.add("show"); else prog.classList.remove("show");
  bar.style.width = p + "%";
}

function compressImage(file, maxSize = 800, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxSize || height > maxSize) {
          const ratio = Math.min(maxSize / width, maxSize / height);
          width = Math.round(width * ratio);
          height = Math.round(height * ratio);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => {
          if (blob) resolve({ blob, width, height });
          else reject(new Error("فشل ضغط الصورة"));
        }, "image/jpeg", quality);
      };
      img.onerror = () => reject(new Error("الملف غير صالح"));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("فشل قراءة الملف"));
    reader.readAsDataURL(file);
  });
}

async function uploadImage(blob) {
  const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;
  const fd = new FormData();
  fd.append("file", blob);
  fd.append("upload_preset", UPLOAD_PRESET);
  if (FOLDER) fd.append("folder", FOLDER);
  const res = await fetch(url, { method: "POST", body: fd });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || "فشل الرفع");
  return data;
}

$("fileInput").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;

  hideStatus();
  $("urlBox").classList.remove("show");

  if (!file.type.startsWith("image/")) return setStatus("❌ الرجاء اختيار ملف صورة", "error");
  if (file.size > 10 * 1024 * 1024) return setStatus("❌ الصورة كبيرة جداً (الحد 10MB)", "error");

  const originalSize = (file.size / 1024).toFixed(1);

  try {
    setStatus("⏳ جاري ضغط الصورة...", "loading");
    setProgress(20);

    const { blob, width, height } = await compressImage(file);
    const compressedSize = (blob.size / 1024).toFixed(1);

    const previewUrl = URL.createObjectURL(blob);
    $("preview").innerHTML = `<img src="${previewUrl}" alt="معاينة">`;

    setStatus("☁️ جاري رفع الصورة...", "loading");
    setProgress(55);

    const result = await uploadImage(blob);
    setProgress(100);
    setStatus("✅ نجح الرفع! الصورة صارت على الخادم.", "success");

    $("urlText").textContent = result.secure_url;
    $("urlBox").classList.add("show");

    $("detailsText").innerHTML = `
      📁 <strong>الحجم الأصلي:</strong> ${originalSize} KB<br>
      📦 <strong>بعد الضغط:</strong> ${compressedSize} KB (${width}×${height})<br>
      🔗 <strong>الخادم:</strong> Cloudinary<br>
      📂 <strong>المجلد:</strong> ${FOLDER}<br>
      🆔 <strong>معرّف الصورة:</strong> ${result.public_id}
    `;

    $("copyBtn").onclick = () => {
      navigator.clipboard.writeText(result.secure_url).then(() => {
        $("copyBtn").textContent = "✅ تم النسخ";
        setTimeout(() => $("copyBtn").textContent = "📋 انسخي الرابط", 2000);
      });
    };

    setTimeout(() => setProgress(0), 1000);
  } catch (err) {
    console.error(err);
    setProgress(0);
    let errorMsg = "❌ فشل الرفع";
    if (err.message.includes("preset")) errorMsg += ": تأكدي إن Preset 'abosalah' صحيح و Unsigned";
    else if (err.message.includes("cloud_name")) errorMsg += ": اسم Cloud Name غير صحيح";
    else errorMsg += ": " + err.message;
    setStatus(errorMsg, "error");
    $("detailsText").innerHTML = `<span style="color:#E85D5D">📌 تفاصيل الخطأ:</span><br>${err.message}`;
  }
});
</script>
</body>
</html>
